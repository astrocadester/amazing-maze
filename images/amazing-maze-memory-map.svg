<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1730" viewBox="0 0 920 1730" role="img" aria-labelledby="title desc">
<title id="title">AMAZING MAZE — Intel 8080 CPU memory map</title><desc id="desc">A dark vertically-stacked hardware memory diagram in the style of Sea Wolf II. Top to bottom: unverified higher address mirror, video RAM, work RAM, unused upper ROM socket, two original game ROM chips, and hardware notes.</desc>
<defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#0e131b"/><stop offset="1" stop-color="#122a3d"/></linearGradient><linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#66266d"/><stop offset="1" stop-color="#311941"/></linearGradient><linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#286c53"/><stop offset="1" stop-color="#153b2f"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#206c87"/><stop offset="1" stop-color="#154057"/></linearGradient><linearGradient id="grey" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#505b69"/><stop offset="1" stop-color="#252c38"/></linearGradient></defs>
<rect width="920" height="1730" fill="url(#bg)"/>
<text x="29" y="77" font-family="Georgia, serif" font-size="49" fill="#f1f5f9" font-weight="700">AMAZING MAZE</text>
<text x="30" y="107" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#a8c0d9" font-weight="400">INTEL 8080 CPU ADDRESS SPACE  ·  1976</text>
<path d="M 807 60 L 895 60 M 851 18 L 851 104 M 820 60 A 31 31 0 1 1 882 60 A 31 31 0 1 1 820 60" fill="none" stroke="#49b8f0" stroke-width="2"/><circle cx="851" cy="60" r="4" fill="#facc15"/>
<path d="M 26 125 H 896" stroke="#d9e4f0"/>
<rect x="24" y="147" width="872" height="220" rx="18" fill="url(#grey)" stroke="#e2e8f0" stroke-width="1.1"/><text x="45" y="190" font-family="monospace" font-size="20" fill="#b7cadc" font-weight="500">$4000–$FFFF</text><text x="270" y="190" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#f1f5f9" font-weight="700">Address aliases / mirror decoding</text><rect x="805" y="166" width="61" height="29" rx="16" fill="#07111c" stroke="#b2c0cd" stroke-width="1.1"/><text x="815" y="186" font-family="monospace" font-size="13" fill="#f4f8fd" font-weight="400">audit</text><rect x="724" y="166" width="61" height="29" rx="16" fill="#07111c" stroke="#b2c0cd" stroke-width="1.1"/><text x="734" y="186" font-family="monospace" font-size="13" fill="#f4f8fd" font-weight="400">48 KB</text><text x="46" y="225" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#d1dce8" font-weight="400">Upper address bits and device-select behavior must be</text><text x="46" y="250" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#d1dce8" font-weight="400">confirmed from original hardware schematics and MAME.</text><rect x="46" y="295" width="826" height="51" rx="13" fill="#020a13" stroke="#d1dae5" stroke-width="1.1"/><text x="62" y="324" font-family="monospace" font-size="15" fill="#dce5ef" font-weight="400">MIRROR_CANDIDATE_START   equ $4000\nCPU_LOGICAL_LIMIT       equ $10000\nDECODING_STATUS         equ UNVERIFIED</text>
<rect x="24" y="385" width="872" height="245" rx="18" fill="url(#blue)" stroke="#e2e8f0" stroke-width="1.1"/><text x="45" y="428" font-family="monospace" font-size="20" fill="#b7cadc" font-weight="500">$2400–$3FFF</text><text x="270" y="428" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#f1f5f9" font-weight="700">Bitmap Video RAM</text><rect x="823" y="404" width="43" height="29" rx="16" fill="#07111c" stroke="#b2c0cd" stroke-width="1.1"/><text x="833" y="424" font-family="monospace" font-size="13" fill="#f4f8fd" font-weight="400">R/W</text><rect x="751" y="404" width="52" height="29" rx="16" fill="#07111c" stroke="#b2c0cd" stroke-width="1.1"/><text x="761" y="424" font-family="monospace" font-size="13" fill="#f4f8fd" font-weight="400">7 KB</text><text x="46" y="463" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#d1dce8" font-weight="400">7 KB monochrome framebuffer. CPU-readable/writable.</text><text x="46" y="488" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#d1dce8" font-weight="400">Graphics drawing and collision records require source tracing.</text><rect x="46" y="533" width="826" height="76" rx="13" fill="#020a13" stroke="#d1dae5" stroke-width="1.1"/><text x="62" y="562" font-family="monospace" font-size="15" fill="#dce5ef" font-weight="400">VIDEO_RAM_START        equ $2400\nVIDEO_RAM_END          equ $3FFF\nVIDEO_RAM_SIZE         equ $1C00</text>
<rect x="24" y="649" width="872" height="245" rx="18" fill="url(#green)" stroke="#e2e8f0" stroke-width="1.1"/><text x="45" y="692" font-family="monospace" font-size="20" fill="#b7cadc" font-weight="500">$2000–$23FF</text><text x="270" y="692" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#f1f5f9" font-weight="700">Work RAM</text><rect x="778" y="668" width="88" height="29" rx="16" fill="#07111c" stroke="#b2c0cd" stroke-width="1.1"/><text x="788" y="688" font-family="monospace" font-size="13" fill="#f4f8fd" font-weight="400">SP $2400</text><rect x="706" y="668" width="52" height="29" rx="16" fill="#07111c" stroke="#b2c0cd" stroke-width="1.1"/><text x="716" y="688" font-family="monospace" font-size="13" fill="#f4f8fd" font-weight="400">1 KB</text><text x="46" y="727" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#d1dce8" font-weight="400">Game state, current script, counters, maze state and stack.</text><text x="46" y="752" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#d1dce8" font-weight="400">Interpreter reads its cursor from $2000; reset sets SP=$2400.</text><rect x="46" y="797" width="826" height="76" rx="13" fill="#020a13" stroke="#d1dae5" stroke-width="1.1"/><text x="62" y="826" font-family="monospace" font-size="15" fill="#dce5ef" font-weight="400">SCRIPT_CURSOR         equ $2000\nSCRIPT_ROOT            equ $2002\nSTACK_INITIAL_SP       equ $2400\nWORK_RAM_LIMIT         equ $2400</text>
<rect x="24" y="913" width="872" height="206" rx="18" fill="url(#grey)" stroke="#e2e8f0" stroke-width="1.1"/><text x="45" y="956" font-family="monospace" font-size="20" fill="#b7cadc" font-weight="500">$1000–$1FFF</text><text x="270" y="956" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#f1f5f9" font-weight="700">Unpopulated program ROM</text><rect x="814" y="932" width="52" height="29" rx="16" fill="#07111c" stroke="#b2c0cd" stroke-width="1.1"/><text x="824" y="952" font-family="monospace" font-size="13" fill="#f4f8fd" font-weight="400">4 KB</text><text x="46" y="991" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#d1dce8" font-weight="400">An 8 KB ROM address window exists on the platform.</text><text x="46" y="1016" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#d1dce8" font-weight="400">Amazing Maze supplies only the lower 4 KB.</text><rect x="46" y="1061" width="826" height="37" rx="13" fill="#020a13" stroke="#d1dae5" stroke-width="1.1"/><text x="62" y="1090" font-family="monospace" font-size="15" fill="#dce5ef" font-weight="400">UNPOPULATED_ROM_START  equ $1000\nUNPOPULATED_ROM_END    equ $1FFF</text>
<rect x="24" y="1137" width="872" height="381" rx="19" fill="url(#purple)" stroke="#d8c7e3"/>
<text x="45" y="1183" font-family="monospace" font-size="20" fill="#dec9f0" font-weight="500">$0000–$0FFF</text>
<text x="270" y="1183" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#ffffff" font-weight="700">Program ROM</text>
<text x="46" y="1222" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#dfe8f3" font-weight="400">Read-only original Intel 8080 game image: two 2 KB ROM devices.</text>
<rect x="46" y="1247" width="404" height="132" rx="13" fill="#050d17" stroke="#e0d2ea" stroke-width="1.1"/>
<rect x="465" y="1247" width="408" height="132" rx="13" fill="#050d17" stroke="#e0d2ea" stroke-width="1.1"/>
<text x="76" y="1280" font-family="monospace" font-size="23" fill="#f3f7ff" font-weight="700">MAZE.G</text>
<text x="76" y="1311" font-family="monospace" font-size="17" fill="#65d0f4" font-weight="400">$0800–$0FFF  ·  2 KB</text>
<text x="76" y="1343" font-family="monospace" font-size="16" fill="#d1d9e6" font-weight="400">CRC32 65FAD839</text>
<text x="492" y="1280" font-family="monospace" font-size="23" fill="#f3f7ff" font-weight="700">MAZE.H</text>
<text x="492" y="1311" font-family="monospace" font-size="17" fill="#65d0f4" font-weight="400">$0000–$07FF  ·  2 KB</text>
<text x="492" y="1343" font-family="monospace" font-size="16" fill="#d1d9e6" font-weight="400">CRC32 F2860CFF</text>
<text x="48" y="1410" font-family="monospace" font-size="17" fill="#f9d15b" font-weight="500">Original 4 KB ROM: dispatch $0392; vectors $0BEE; script $0D64</text>
<rect x="46" y="1432" width="827" height="65" rx="12" fill="#040c15" stroke="#dbc4e9" stroke-width="1.1"/>
<text x="61" y="1458" font-family="monospace" font-size="15" fill="#e0e7ef" font-weight="400">PROGRAM_ROM_START      equ $0000</text>
<text x="61" y="1481" font-family="monospace" font-size="15" fill="#e0e7ef" font-weight="400">PROGRAM_ROM_END        equ $0FFF</text>
<path d="M 25 1541 H 897" stroke="#d1e0ed"/>
<rect x="24" y="1556" width="872" height="59" rx="10" fill="#020910" stroke="#b0becd" stroke-width="1.1"/>
<text x="42" y="1592" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#f6c84a" font-weight="700">ROM identity:</text>
<text x="178" y="1592" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#dfe8f3" font-weight="400">Original maze.h / maze.g hashes are enforced by build scripts.</text>
<rect x="24" y="1622" width="872" height="76" rx="10" fill="#020910" stroke="#b0becd" stroke-width="1.1"/>
<text x="42" y="1654" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#f6c84a" font-weight="700">Evidence:</text>
<text x="146" y="1654" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#dfe8f3" font-weight="400">$2000 script cursor and $2002 root from ROM scanner.</text>
<text x="42" y="1679" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#dfe8f3" font-weight="400">Port assignments, mirrors and detailed RAM ownership remain under RE.</text>
</svg>